<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нажмите, чтобы закрыть</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    .player {
      width: 85%;
      max-width: 360px;
      padding: 28px;
      text-align: center;
      background: #222;
      border-radius: 20px;
      box-shadow: 0 0 30px #ff4da6;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="player">
    <h1>Нажмите, чтобы закрыть</h1>
    <audio controls loop>
      <source src="./music.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудио.
    </audio>
  </div>
</body>
</html>
