<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нажмите, чтобы закрыть</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 20px;
      text-align: center;
      background: #222;
      border-radius: 24px;
      box-shadow: 0 0 28px #ff4da6;
    }

    button {
      border: 0;
      background: none;
      color: white;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      padding: 15px 5px;
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      color: #bbb;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <button id="playButton">Нажмите, чтобы закрыть</button>
    <div class="hint" id="hint">Нажмите на надпись</div>
    <audio id="music" src="./music.mp3" loop preload="auto"></audio>
  </main>

  <script>
    const music = document.getElementById('music');
    const button = document.getElementById('playButton');
    const hint = document.getElementById('hint');

    button.addEventListener('click', async () => {
      if (music.paused) {
        try {
          music.volume = 1.0;
          music.playbackRate = 2.0;
          await music.play();
          hint.textContent = 'До свидания';
        } catch {
          hint.textContent = 'Давай ты сможешь ещё чуть чуть!';
        }
      } else {
        music.pause();
        hint.textContent = 'Привет';
      }
    });
  </script>
</body>
</html>
