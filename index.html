<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>I GOT U — Gay Remix</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(90%, 360px);
      padding: 28px;
      text-align: center;
      background: #202020;
      border-radius: 24px;
    }

    .cover {
      height: 220px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff4da6, #713cff);
      font-size: 80px;
    }

    h1 { margin-top: 24px; }
    p { color: #bbb; }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .note {
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="player">
    <div class="cover">♫</div>
    <h1>I GOT U</h1>
    <p>Gay Remix</p>

    <audio controls preload="none">
      <source src="music.mp3" type="audio/mpeg">
      Твой браузер не поддерживает аудио.
    </audio>

    <p class="note">
      Нажми ▶ для воспроизведения.
    </p>
  </main>
</body>
</html>
