<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1c">
  <title>♡</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 20%, #48205e, transparent 55%),
        linear-gradient(145deg, #0b0913, #1c1029, #090812);
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 370px;
      padding: 30px 24px;
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: #ffffff0b;
      box-shadow: 0 0 60px #b54aff20;
      backdrop-filter: blur(14px);
    }

    .cover {
      width: 190px;
      height: 190px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      border-radius: 25px;
      background: linear-gradient(135deg, #ff4eae, #8050ff);
      box-shadow: 0 0 35px #c34bff45;
      font-size: 76px;
    }

    h1 {
      font-size: 23px;
      line-height: 1.4;
      margin: 12px 0;
    }

    .subtitle {
      color: #c8b9d9;
      font-size: 14px;
      margin-bottom: 25px;
    }

    audio {
      display: block;
      width: 100%;
      margin: 20px 0;
    }

    .close {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(100deg, #ff4eae, #8050ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .hint {
      color: #bdb0ca;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cover">♫</div>

    <h1>Нажмите, чтобы закрыть</h1>
    <div class="subtitle">♡ Have a nice day ♡</div>

    <audio id="music" controls preload="metadata">
      <source src="./music.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудио.
    </audio>

    <button class="close" id="closeButton">
      ✕ Закрыть
    </button>

    <div class="hint" id="hint">
      Нажмите ▶, чтобы включить музыку
    </div>
  </main>

  <script>
    const closeButton = document.getElementById("closeButton");
    const hint = document.getElementById("hint");

    closeButton.addEventListener("click", () => {
      window.close();
      hint.textContent =
        "Чтобы закрыть страницу, нажмите «Назад» в браузере.";
    });
  </script>
</body>
</html>
