<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I GOT U — Gay Remix</title>
  <meta name="theme-color" content="#101010">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    .player {
      width: min(90%, 360px);
      padding: 30px 24px;
      text-align: center;
      background: #202020;
      border: 1px solid #383838;
      border-radius: 24px;
    }
    .cover {
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff4da6, #713cff);
      font-size: 58px;
    }
    h1 { font-size: 25px; margin: 10px 0; }
    p { color: #bbb; }
    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #ff4da6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .note { font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="player">
    <div class="cover">♫</div>
    <h1>I GOT U</h1>
    <p>Gay Remix</p>
    <button id="play">▶ Открыть музыку</button>
    <p class="note">
      Если звук не запускается автоматически,
      нажми кнопку воспроизведения на странице трека.
    </p>
  </main>

  <script>
    const track = "https://uwupad.me/sound/70843";

    document.getElementById("play").addEventListener("click", () => {
      window.location.href = track;
    });

    // Пробуем открыть трек автоматически.
    // Браузер может потребовать действия пользователя.
    window.addEventListener("load", () => {
      window.location.replace(track);
    });
  </script>
</body>
</html>
